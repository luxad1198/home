<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Коммерческое предложение — ООО «РТСтандарт»</title>
  <style>
    :root {
      --header-bg: #ACB9CA; /* Оригинальный цвет заливки из Word */
    }
    * { 
      box-sizing: border-box; 
      font-family: 'Times New Roman', Times, serif; 
    }
    body { 
      background: #e5e7eb; 
      margin: 0; 
      padding: 20px; 
      color: #000; 
    }
    
    /* Панель управления */
    .controls-panel {
      max-width: 210mm;
      margin: 0 auto 15px;
      background: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid #1a56db;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      font-family: Arial, sans-serif;
    }
    .btn-primary { background: #1a56db; color: #fff; }
    .btn-secondary { background: #f3f4f6; color: #111; border-color: #cbd5e1; }
    .btn-danger { 
      background: #fee2e2; 
      color: #b91c1c; 
      border: 1px solid #f87171; 
      padding: 2px 6px; 
      font-size: 11px; 
      cursor: pointer; 
    }

    /* Лист А4 */
    .page {
      width: 210mm;
      min-height: 297mm;
      padding: 12mm 15mm 15mm 18mm;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      position: relative;
      font-size: 12pt;
      line-height: 1.25;
    }

    /* Шапка документа */
    .header-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }
    .header-table td {
      vertical-align: top;
      border: none;
      padding: 0;
    }
    .logo-img {
      max-height: 52px;
      margin-bottom: 6px;
      display: block;
    }
    .requisites {
      font-size: 12pt;
      line-height: 1.25;
    }
    .doc-meta {
      margin-top: 10px;
      font-size: 12pt;
    }
    .doc-meta input {
      font-family: inherit;
      font-size: 12pt;
      border: none;
      border-bottom: 1px dashed #777;
      outline: none;
      background: transparent;
    }
    .client-block {
      width: 48%;
      padding-left: 15px;
      font-size: 12pt;
    }
    .client-block textarea {
      width: 100%;
      font-family: inherit;
      font-size: 12pt;
      border: none;
      border-bottom: 1px dashed #777;
      outline: none;
      resize: none;
      overflow: hidden;
      line-height: 1.25;
      background: transparent;
      display: block;
    }

    /* Заголовок КП */
    .title-doc {
      text-align: center;
      font-size: 12pt;
      font-weight: bold;
      margin: 16px 0 8px;
      letter-spacing: 0.5px;
    }
    .intro-text {
      text-align: justify;
      text-indent: 12mm;
      font-size: 12pt;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    /* Таблица спецификации */
    table.kp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
      margin-bottom: 8px;
    }
    table.kp-table th, table.kp-table td {
      border: 1px solid #000;
      padding: 4px 5px;
      vertical-align: top;
    }

      background-color: var(--header-bg);
      text-align: center;
