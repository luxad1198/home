# Temporary one-time verification for bootstrap of PR #5.
# This workflow will be removed after recording the results.
name: Bootstrap smoke test verification

on:
  pull_request:
    paths:
      - 'scripts/smoke-tests.cjs'
      - '.github/workflows/verify-smoke-bootstrap.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run baseline smoke tests
        run: |
          node --check app.js
          node --check scripts/smoke-tests.cjs
          node --test scripts/smoke-tests.cjs
