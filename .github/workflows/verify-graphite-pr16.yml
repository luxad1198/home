name: Temporary PR16 Graphite controls verification
# One-time check of parallel LIScorp Graphite UI changes; delete after review.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-graphite-pr16.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium without apt
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verify branded controls, calculator, actions and mobile layout
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/check-graphite-ui-pr16.cjs
          node scripts/check-graphite-ui-pr16.cjs | tee "$RUNNER_TEMP/graphite.log"
          grep -q 'GRAPHITE UI ACCEPTANCE PASSED' "$RUNNER_TEMP/graphite.log"
      - name: Attach real current-theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-current-graphite
          path: artifacts/ui-graphite-check/*.png
          retention-days: 3
          if-no-files-found: ignore