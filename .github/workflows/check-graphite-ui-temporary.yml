name: Temporary LIScorp Graphite UI acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/check-graphite-ui-temporary.yml'
      - 'index.html'
      - 'style.css'
      - 'scripts/check-ui-graphite-pr16.cjs'

permissions:
  contents: read

jobs:
  ui-graphite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real-browser screenshots
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Check UI interactions, all companies and print isolation
        shell: bash
        run: |
          set -o pipefail
          node --check app.js
          node --check scripts/check-ui-graphite-pr16.cjs
          node scripts/check-ui-graphite-pr16.cjs | tee "$RUNNER_TEMP/ui-graphite.log"
          grep -q 'LISCORP GRAPHITE ACCEPTANCE PASSED' "$RUNNER_TEMP/ui-graphite.log"
      - name: Attach genuine Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liscorp-graphite-real-screenshots
          path: artifacts/liscorp-graphite/*.png
          retention-days: 3
          if-no-files-found: ignore
