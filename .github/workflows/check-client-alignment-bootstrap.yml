name: Temporary customer placeholder alignment
# One-time targeted check for ООО and ИП Захаров empty-customer alignment.
on:
  pull_request:
    paths:
      - '.github/workflows/check-client-alignment-bootstrap.yml'
permissions:
  contents: read
jobs:
  customer-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Playwright without system packages
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Check empty/filled/cleared customer and existing six previews
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/live-preview-tests.cjs
          node scripts/live-preview-tests.cjs | tee "$RUNNER_TEMP/customer-alignment.log"
          grep -q 'Live preview checks passed: 6 companies/cases.' "$RUNNER_TEMP/customer-alignment.log"
          for name in ooo-short ip-short; do
            test -s "artifacts/live-preview/$name-customer-empty.png"
            test -s "artifacts/live-preview/$name-customer-filled.png"
          done
      - name: Attach only real cropped screenshots of customer field
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: customer-label-before-after
          path: |
            artifacts/live-preview/*-customer-empty.png
            artifacts/live-preview/*-customer-filled.png
          retention-days: 3
          if-no-files-found: error