name: Temporary Word PDF browser visual alignment review

on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'scripts/pr21-screen-regression.cjs'
      - 'scripts/pr21-compare.py'
      - '.github/workflows/pr21-visual-compare-temporary.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and document test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 docx@8.5.0 jszip@3.10.1 file-saver@2.0.5
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python3 -m pip install --break-system-packages pypdf==6.1.1 pymupdf==1.26.5 pillow==11.3.0
      - name: Test real browser styles for all three companies
        shell: bash
        run: |
          set -o pipefail
          node --check app.js
          node --check scripts/pr21-screen-regression.cjs
          node --test scripts/pr21-screen-regression.cjs | tee "$RUNNER_TEMP/screen.log"
          grep -q '# pass 4' "$RUNNER_TEMP/screen.log"
          grep -q '# fail 0' "$RUNNER_TEMP/screen.log"
          node scripts/live-preview-tests.cjs | tee "$RUNNER_TEMP/live-preview.log"
      - name: Export and check real Word and PDF for both affected companies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          node scripts/generate-word-documents.cjs ooo ip
          python3 scripts/check-word-documents.py ooo ip
          node scripts/generate-print-pdfs.cjs ooo ip
          python3 scripts/check-print-pdfs.py ooo ip
          python3 scripts/check-export-parity.py ooo ip
          python3 scripts/render-word-documents.py ooo ip
          python3 scripts/pr21-compare.py
      - name: Upload genuine site, rendered Word, and PDF comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr21-site-word-pdf-comparison
          path: artifacts/pr21-compare/*.png
          retention-days: 10
          if-no-files-found: warn
