name: Temporary live preview parity verification
# ONE-TIME PR #14 acceptance; remove before asking for merge.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-live-preview-bootstrap.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test-only Word/Chromium dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 docx@8.5.0 jszip@3.10.1 file-saver@2.0.5
          npx playwright install --with-deps chromium
      - name: Check code and 6 live-preview/browser PDF scenarios
        shell: bash
        run: |
          node --check app.js
          node --check scripts/live-preview-tests.cjs
          node scripts/live-preview-tests.cjs | tee "$RUNNER_TEMP/live-preview.log"
          grep -q 'Live preview checks passed: 6 companies/cases.' "$RUNNER_TEMP/live-preview.log"
      - name: Check all 6 fresh A4 print PDFs
        run: |
          python3 -m venv "$RUNNER_TEMP/live-pdf-env"
          "$RUNNER_TEMP/live-pdf-env/bin/pip" install pypdf==6.1.1
          "$RUNNER_TEMP/live-pdf-env/bin/python" - <<'PY'
          import json, pathlib
          from pypdf import PdfReader
          root=pathlib.Path('artifacts/live-preview')
          samples=json.loads((root/'result.json').read_text())
          assert len(samples)==6, samples
          for item in samples:
              p=root/(item['name']+'-pdf.pdf')
              reader=PdfReader(p)
              assert len(reader.pages)>=1
              for page in reader.pages:
                  assert abs(float(page.mediabox.width)-595.28)<3
                  assert abs(float(page.mediabox.height)-841.89)<3
              print('OK PDF',item['name'],len(reader.pages),'A4 pages')
          PY
      - name: Verify real Word export has not regressed
        run: |
          node scripts/generate-word-documents.cjs && python3 scripts/check-word-documents.py
      - name: Generate corresponding PDF first-page images for visual review
        shell: bash
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          mkdir -p artifacts/live-preview/printed-images
          for file in artifacts/live-preview/*-pdf.pdf; do
            name=$(basename "$file" -pdf.pdf)
            pdftoppm -f 1 -l 1 -scale-to 1200 -png -singlefile "$file" "artifacts/live-preview/printed-images/$name"
          done
      - name: Keep only visual review assets for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr14-live-preview-comparison
          path: |
            artifacts/live-preview/*-web.png
            artifacts/live-preview/printed-images/*.png
            artifacts/live-preview/result.json
          retention-days: 3
          if-no-files-found: ignore
