name: Temporary editor viewport and counter regression
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'scripts/editor-viewport-tests.cjs'
      - 'scripts/import-docx-tests.cjs'
      - '.github/workflows/editor-viewport-temporary.yml'
permissions:
  contents: read
jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 jszip@3.10.1 docx@8.5.0 file-saver@2.0.5
          npx playwright install chromium
      - name: Check syntax and run real UI regression
        shell: bash
        run: |
          set -o pipefail
          node --check app.js
          node --check scripts/editor-viewport-tests.cjs
          node --check scripts/import-docx-tests.cjs
          node --test scripts/editor-viewport-tests.cjs | tee "$RUNNER_TEMP/viewport.log"
          grep -q '# pass 4' "$RUNNER_TEMP/viewport.log"
          grep -q '# fail 0' "$RUNNER_TEMP/viewport.log"
          node scripts/import-docx-tests.cjs append replace undo | tee "$RUNNER_TEMP/import.log"
          grep -q '# pass 3' "$RUNNER_TEMP/import.log"
          grep -q '# fail 0' "$RUNNER_TEMP/import.log"
      - name: Upload screenshots from Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-viewport-pr-screenshots
          path: artifacts/editor-viewport/*.png
          retention-days: 5
          if-no-files-found: ignore
