name: Temporary customer placeholder alignment PR17
on:
  pull_request:
    paths:
      - '.github/workflows/verify-customer-align-pr17.yml'
      - 'style.css'
permissions:
  contents: read
jobs:
  customer-placeholder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium for authentic screenshot
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verify real empty-field and entered-value alignment
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),http=require('http'),path=require('path');
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          fs.mkdirSync('artifacts/customer-align-pr17',{recursive:true});
          const server=http.createServer((req,res)=>{
            const file=(req.url||'/').split('?')[0].replace(/^\//,'')||'index.html';
            if(!/^(index\.html|style\.css|app\.js|[\w-]+\.webp)$/.test(file)){res.writeHead(404).end();return;}
            fs.readFile(path.join(process.cwd(),file),(err,data)=>{
              if(err){res.writeHead(404).end();return;}
              res.setHeader('Content-Type',{'.html':'text/html','.css':'text/css','.js':'text/javascript','.webp':'image/webp'}[path.extname(file)]||'text/plain');
              res.end(data);
            });
          });
          (async()=>{
            await new Promise(ok=>server.listen(0,'127.0.0.1',ok));
            const browser=await chromium.launch({headless:true});
            try{
              const url='http://127.0.0.1:'+server.address().port+'/';
              for(const [company,sel] of [['ooo','#clientBox'],['ip','#clientBoxIp'],['ip-glazyrin','#clientBoxIp']]){
                const context=await browser.newContext({viewport:{width:1530,height:950},locale:'ru-RU'});
                const page=await context.newPage();
                await page.route('https://**/*',r=>r.abort());
                await page.goto(url,{waitUntil:'load'});
                await page.locator('#companySelect').selectOption(company);
                const row=page.locator(sel).locator('xpath=ancestor::*[contains(@class,"client-inline-row")]');
                const initial=await row.evaluate(el=>{
                  const label=el.querySelector('.client-label'),input=el.querySelector('textarea');
                  const a=getComputedStyle(label),b=getComputedStyle(input);
                  return {labelFont:a.fontSize,inputFont:b.fontSize,
                          labelLine:a.lineHeight,inputLine:b.lineHeight,
                          empty:input.matches(':placeholder-shown')};
                });
                assert(initial.empty,'Field must begin empty for '+company);
                if(company==='ip-glazyrin'){
                  assert.notEqual(initial.inputFont,initial.labelFont,
                    'Glazyrin font was unexpectedly changed');
                }else{
                  assert.equal(initial.inputFont,initial.labelFont,company+' font mismatch');
                  assert.equal(initial.inputLine,initial.labelLine,company+' line height mismatch');
                  const fit=await row.evaluate(el=>{
                    const ta=el.querySelector('textarea'),c=document.createElement('canvas').getContext('2d');
                    c.font=getComputedStyle(ta).font;
                    return {needed:c.measureText(ta.placeholder).width,available:ta.clientWidth};
                  });
                  assert(fit.needed<=fit.available+1,company+' placeholder wraps or clips: '+JSON.stringify(fit));
                }
                await row.screenshot({path:'artifacts/customer-align-pr17/'+company+'-empty.png'});
                await page.locator(sel).fill('ООО Тестовый заказчик');
                // Live print mirror sync runs in requestAnimationFrame, not synchronously on input.
                await page.waitForFunction((selector)=> {
                  const el=document.querySelector(selector);
                  return el?.closest('.client-inline-row')?.querySelector('.client-print-value')
                    ?.textContent==='ООО Тестовый заказчик';
                },sel);
                await row.screenshot({path:'artifacts/customer-align-pr17/'+company+'-filled.png'});
                if(company!=='ip-glazyrin'){
                  await page.emulateMedia({media:'print'});
                  const screenshotStyle=await page.locator(sel).evaluate(el=>getComputedStyle(el).display);
                  assert.equal(screenshotStyle,'none',company+' print textarea must stay hidden');
                  assert.equal(await row.locator('.client-print-value').textContent(),'ООО Тестовый заказчик');
                  await page.emulateMedia({media:'screen'});
                }
                console.log('OK '+company+' '+JSON.stringify(initial));
                await context.close();
              }
              console.log('CUSTOMER PLACEHOLDER ALIGNMENT PASSED');
            }finally{
              await browser.close();
              await new Promise(resolve=>server.close(resolve));
            }
          })().catch(err=>{console.error(err.stack||err);process.exitCode=1});
          NODE
      - name: Attach browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr17-customer-line-real-screenshots
          path: artifacts/customer-align-pr17/*.png
          retention-days: 3
          if-no-files-found: ignore
