name: Temporary RTStandard footer visual verification
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'scripts/check-word-documents.py'
      - 'scripts/check-print-pdfs.py'
      - 'scripts/rtstandard-footer-preview-temporary.cjs'
      - 'scripts/rtstandard-footer-compare-temporary.py'
      - '.github/workflows/rtstandard-footer-temporary.yml'
permissions:
  contents: read
jobs:
  footer:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser, Word and PDF test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 docx@8.5.0 jszip@3.10.1 file-saver@2.0.5
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python3 -m pip install --break-system-packages pypdf==6.1.1 pymupdf==1.26.5 pillow==11.3.0
      - name: Verify real browser footer and unchanged IP templates
        run: |
          node --check app.js
          node scripts/rtstandard-footer-preview-temporary.cjs
      - name: Verify actual DOCX and PDF export of RTStandard
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rtstandard-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          node scripts/generate-word-documents.cjs ooo
          python3 scripts/check-word-documents.py ooo
          node scripts/generate-print-pdfs.cjs ooo
          python3 scripts/check-print-pdfs.py ooo
          python3 scripts/check-export-parity.py ooo
          python3 scripts/render-word-documents.py ooo
          python3 scripts/rtstandard-footer-compare-temporary.py
      - name: Upload actual browser-Word-PDF screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtstandard-footer-real-visuals
          path: artifacts/rtstandard-footer-visual/*.png
          retention-days: 7
          if-no-files-found: warn
