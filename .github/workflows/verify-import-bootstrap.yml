name: Temporary focused DOCX import verification
# ONE-TIME PR #11 test. Delete this workflow after verification.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-import-bootstrap.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test-only dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 docx@8.5.0 jszip@3.10.1 file-saver@2.0.5
          npx playwright install --with-deps chromium
      - name: Real import, cancellation, corruption, undo and Word roundtrip
        shell: bash
        run: |
          set -o pipefail
          node --check app.js
          node --check scripts/import-docx-tests.cjs
          node scripts/import-docx-tests.cjs append replace cancel invalid undo roundtrip | tee "$RUNNER_TEMP/docx-import.log"
          grep -Eq '^# tests 6$' "$RUNNER_TEMP/docx-import.log"
          grep -Eq '^# pass 6$' "$RUNNER_TEMP/docx-import.log"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/docx-import.log"
