name: Temporary review fixes verification
# ONE-TIME testing on PR #8. Remove this file when checks are complete.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-review-bootstrap.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 docx@8.5.0 jszip@3.10.1 file-saver@2.0.5
          npx playwright install --with-deps chromium
      - name: Run only affected smoke groups; reject zero matching cases
        shell: bash
        run: |
          set -o pipefail
          node --check app.js
          node --check scripts/smoke-tests.cjs
          node --test --test-name-pattern='^(spec|calculator):' scripts/smoke-tests.cjs | tee "$RUNNER_TEMP/smoke.log"
          grep -Eq '^# pass 7$' "$RUNNER_TEMP/smoke.log"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/smoke.log"
      - name: Generate real Word documents and validate exact totals and rows
        run: |
          node --check scripts/generate-word-documents.cjs
          node scripts/generate-word-documents.cjs
          python3 scripts/check-word-documents.py
      - name: Start local server and verify real PDF exports
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node --check scripts/generate-print-pdfs.cjs
          python3 -m venv "$RUNNER_TEMP/test-python"
          "$RUNNER_TEMP/test-python/bin/pip" install pypdf==6.1.1
          node scripts/generate-print-pdfs.cjs
          "$RUNNER_TEMP/test-python/bin/python" scripts/check-print-pdfs.py
      - name: Verify single-company Word render with isolated pypdf
        shell: bash
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-writer
          fi
          "$RUNNER_TEMP/test-python/bin/python" scripts/render-word-documents.py ip
      - name: Test validator rejects a wrong DOCX table total
        run: |
          python3 - <<'PY'
          import io, zipfile, pathlib, subprocess, xml.etree.ElementTree as ET
          f=pathlib.Path('artifacts/word-docx/rtstandard.docx')
          original=f.read_bytes()
          w='{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
          try:
              src=zipfile.ZipFile(io.BytesIO(original))
              data={name:src.read(name) for name in src.namelist()}
              src.close()
              root=ET.fromstring(data['word/document.xml'])
              spec=[t for t in root.iter(w+'tbl') if len(t.findall('./'+w+'tblGrid/'+w+'gridCol'))==7][0]
              last=spec.findall('./'+w+'tr')[-1].findall('./'+w+'tc')[-1]
              last.find('.//'+w+'t').text='1,00'
              data['word/document.xml']=ET.tostring(root,encoding='utf-8',xml_declaration=True)
              buf=io.BytesIO()
              with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as z:
                  for name,b in data.items(): z.writestr(name,b)
              f.write_bytes(buf.getvalue())
              result=subprocess.run(['python3','scripts/check-word-documents.py','ooo'],capture_output=True,text=True)
              assert result.returncode!=0, 'DOCX validator accepted a wrong table total'
              assert 'table total' in result.stderr, result.stderr
              print('OK: wrong DOCX table total is rejected')
          finally:
              f.write_bytes(original)
          PY
      - name: Record test-only files if a scenario fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: review-test-failure-samples
          path: |
            artifacts/word-docx/*.docx
            artifacts/print-pdf/*.pdf
          retention-days: 2
          if-no-files-found: ignore
