name: Temporary RTStandard АО ЗСД real parity
on:
  push:
    branches:
      - experiment/rtstandard-aO-ZSD-real-parity
    paths:
      - .github/workflows/experiment-zsd.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual browser and Word export dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 docx@8.5.0 jszip@3.10.1 file-saver@2.0.5
          npx playwright install chromium
      - name: Produce screenshot and both exports from one filled page
        run: |
          node --check scripts/experiment-rtstandard-zsd.cjs
          node scripts/experiment-rtstandard-zsd.cjs
      - name: Render the freshly exported DOCX through LibreOffice
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-writer
          fi
          libreoffice -env:UserInstallation=file:///tmp/lo-zsd-parity --headless --convert-to pdf --outdir artifacts/experiment-zsd artifacts/experiment-zsd/rtstandard-zsd.docx
          test -s artifacts/experiment-zsd/rtstandard-zsd.pdf
          mv artifacts/experiment-zsd/rtstandard-zsd.pdf artifacts/experiment-zsd/rtstandard-zsd-word-rendered.pdf
      - name: Verify same customer, equipment and numeric total in both actual exports
        run: |
          python3 - <<'PY'
          import zipfile,xml.etree.ElementTree as ET,pathlib,subprocess,json
          out=pathlib.Path('artifacts/experiment-zsd')
          fixture=json.loads((out/'test-data.json').read_text())
          with zipfile.ZipFile(out/'rtstandard-zsd.docx') as z:
              root=ET.fromstring(z.read('word/document.xml'))
          ns='{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
          t=''.join(el.text or '' for el in root.iter(ns+'t'))
          for s in (fixture['client'],fixture['product']):
              assert s in t, ('Missing DOCX field', s)
          print('OK actual DOCX contains АО ЗСД and equipment')
          for name in ('rtstandard-zsd-chromium.pdf','rtstandard-zsd-word-rendered.pdf'):
              pdf=out/name
              content=subprocess.check_output(['pdftotext','-layout',str(pdf),'-'],text=True)
              for text in (fixture['client'],fixture['product']):
                  assert text in content, (name,'Missing',text)
              assert '240 000' in content, (name,'Missing total')
              print('OK',name, 'contains same customer, product and total')
          PY
      - name: Render real Word and Chromium PDF pages to PNG
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftoppm -f 1 -l 1 -scale-to 1500 -png -singlefile artifacts/experiment-zsd/rtstandard-zsd-word-rendered.pdf artifacts/experiment-zsd/word-rtstandard-zsd
          pdftoppm -f 1 -l 1 -scale-to 1500 -png -singlefile artifacts/experiment-zsd/rtstandard-zsd-chromium.pdf artifacts/experiment-zsd/pdf-rtstandard-zsd
          ls -lh artifacts/experiment-zsd
      - name: Save actual screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtstandard-zsd-real-web-word-pdf
          path: artifacts/experiment-zsd/
          retention-days: 3
          if-no-files-found: error