name: Temporary truthful multipage preview check
# One-time test for PR #15. Delete this workflow after verification.
on:
  pull_request:
    paths:
      - '.github/workflows/check-real-page-preview-bootstrap.yml'
permissions:
  contents: read
jobs:
  pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies without apt
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Validate real live-edit and native preview for three companies
        shell: bash
        run: |
          set -o pipefail
          node --check app.js
          node --check scripts/live-preview-tests.cjs
          node scripts/live-preview-tests.cjs | tee "$RUNNER_TEMP/page-preview.log"
          grep -q 'Live preview checks passed: 6 companies/cases.' "$RUNNER_TEMP/page-preview.log"
          test $(find artifacts/live-preview -maxdepth 1 -name '*-page-guidance.png' | wc -l) -eq 3
      - name: Compare true Chromium PDF page counts with honest screen flags
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-venv"
          "$RUNNER_TEMP/pdf-venv/bin/pip" install pypdf==6.1.1
          "$RUNNER_TEMP/pdf-venv/bin/python" - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          folder=Path('artifacts/live-preview')
          for company in ('ooo','ip','ip-glazyrin'):
              for suffix in ('short','long'):
                  filename=company+'-'+suffix
                  reader=PdfReader(folder/(filename+'-pdf.pdf'))
                  pages=len(reader.pages)
                  assert pages == 1 if suffix=='short' else pages>=2, (filename,pages)
                  for page in reader.pages:
                      assert abs(float(page.mediabox.width)-595.28)<3
                      assert abs(float(page.mediabox.height)-841.89)<3
                  print('OK',filename,pages,'real A4 PDF pages')
          PY
      - name: Upload only page guidance visual proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: page-preview-hints
          path: artifacts/live-preview/*-page-guidance.png
          retention-days: 3
          if-no-files-found: error
