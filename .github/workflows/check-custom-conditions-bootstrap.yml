name: Temporary custom conditions verification
# ONE-TIME PR #10 test only; delete before merging.
on:
  pull_request:
    paths:
      - '.github/workflows/check-custom-conditions-bootstrap.yml'
permissions:
  contents: read
jobs:
  verify-conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Word libraries
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 docx@8.5.0 jszip@3.10.1 file-saver@2.0.5
          npx playwright install --with-deps chromium
      - name: Real Word exports with reloaded custom conditions
        run: |
          node --check app.js
          node --check scripts/custom-condition-fixtures.cjs
          node --check scripts/generate-word-documents.cjs
          node --check scripts/generate-print-pdfs.cjs
          node scripts/generate-word-documents.cjs conditions-ooo conditions-ip conditions-ip-glazyrin
          python3 scripts/check-word-documents.py conditions-ooo conditions-ip conditions-ip-glazyrin
      - name: Actual printed PDFs and cross-format condition parity
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/conditions-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          python3 -m venv "$RUNNER_TEMP/condition-python"
          "$RUNNER_TEMP/condition-python/bin/pip" install pypdf==6.1.1
          node scripts/generate-print-pdfs.cjs conditions-ooo conditions-ip conditions-ip-glazyrin
          "$RUNNER_TEMP/condition-python/bin/python" scripts/check-print-pdfs.py conditions-ooo conditions-ip conditions-ip-glazyrin
          "$RUNNER_TEMP/condition-python/bin/python" scripts/check-export-parity.py conditions-ooo conditions-ip conditions-ip-glazyrin
      - name: Convert only affected Word variants to PDF for print-layout checks
        shell: bash
        run: |
          if ! command -v libreoffice > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-writer
          fi
          "$RUNNER_TEMP/condition-python/bin/python" scripts/render-word-documents.py conditions-ooo conditions-ip conditions-ip-glazyrin
      - name: Keep test documents only if a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: condition-failure-samples
          path: |
            artifacts/word-docx/*conditions.docx
            artifacts/print-pdf/*conditions.pdf
            artifacts/word-rendered/*conditions.pdf
          retention-days: 2
          if-no-files-found: ignore
