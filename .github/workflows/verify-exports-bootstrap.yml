# Temporary, one-time PR verification. Delete after the initial test run.
name: Bootstrap export verification
on:
  pull_request:
    paths:
      - 'scripts/generate-word-documents.cjs'
      - 'scripts/check-word-documents.py'
      - 'scripts/render-word-documents.py'
      - 'scripts/generate-print-pdfs.cjs'
      - 'scripts/check-print-pdfs.py'
      - '.github/workflows/verify-exports-bootstrap.yml'
permissions:
  contents: read
jobs:
  exports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test libraries and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 docx@8.5.0 jszip@3.10.1 file-saver@2.0.5
          npx playwright install --with-deps chromium
      - name: Generate and validate actual Word documents
        run: |
          node --check scripts/generate-word-documents.cjs
          node scripts/generate-word-documents.cjs
          python3 scripts/check-word-documents.py
      - name: Generate and validate printed PDF documents
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/generate-print-pdfs.cjs
          python3 -m venv "$RUNNER_TEMP/pdf-venv"
          "$RUNNER_TEMP/pdf-venv/bin/pip" install pypdf==6.1.1
          "$RUNNER_TEMP/pdf-venv/bin/python" scripts/check-print-pdfs.py
      - name: Render Word through LibreOffice and verify layout basics
        shell: bash
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-writer
          fi
          "$RUNNER_TEMP/pdf-venv/bin/python" scripts/render-word-documents.py
      - name: Attach documents for manual visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-samples
          path: |
            artifacts/word-docx/*.docx
            artifacts/word-rendered/*.pdf
            artifacts/print-pdf/*.pdf
          retention-days: 14
          if-no-files-found: warn
